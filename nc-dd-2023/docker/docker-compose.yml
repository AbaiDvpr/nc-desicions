version: '3.8'

services:
  desktop:
    image: arrim/basephp:81m
    volumes:
      - ../:/srv/www
      - /tmp/:/tmp
      - ./dev/nginx/mono.conf:/etc/nginx/http.d/default.conf
      - ./dev/config/php-fpm/mono.conf:/etc/php81/php-fpm.d/mono.conf
      - ./dev/supervisord.conf:/etc/supervisord.conf
    ports:
      - "127.0.0.1:8000:80"
    environment:
      - APP_PROJECT=desktop

  api:
    image: arrim/basephp:81m
    volumes:
      - ../:/srv/www
      - /tmp/:/tmp
      - ./dev/nginx/mono.conf:/etc/nginx/http.d/default.conf
      - ./dev/config/php-fpm/mono.conf:/etc/php81/php-fpm.d/mono.conf
      - ./dev/supervisord.conf:/etc/supervisord.conf
    ports:
      - "127.0.0.1:8001:80"
    environment:
      - APP_PROJECT=api

  admin:
    image: arrim/basephp:81m
    volumes:
      - ../:/srv/www
      - /tmp/:/tmp
      - ./dev/nginx/mono.conf:/etc/nginx/http.d/default.conf
      - ./dev/config/php-fpm/mono.conf:/etc/php81/php-fpm.d/mono.conf
      - ./dev/supervisord.conf:/etc/supervisord.conf
    environment:
      - APP_PROJECT=admin
    ports:
      - "127.0.0.1:8002:80"

